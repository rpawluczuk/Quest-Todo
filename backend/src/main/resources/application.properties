spring.application.name=QuestTodo
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/quest_todo}
spring.datasource.username=${DB_USER:quest_todo}
spring.datasource.password=${DB_PASSWORD:quest_todo_local}
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
app.public-url=${APP_PUBLIC_URL:}
app.mail.mode=${MAIL_MODE:disabled}
app.mail.api-key=${MAIL_API_KEY:}
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:Quest Todo}
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:}
app.bootstrap.login=${INITIAL_USER_LOGIN:}
app.bootstrap.password=${INITIAL_USER_PASSWORD:}
server.servlet.session.timeout=8h
server.servlet.session.tracking-modes=cookie
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=${SESSION_COOKIE_SAME_SITE:lax}
