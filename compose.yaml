name: quest-todo

services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_DB: quest_todo
      POSTGRES_USER: quest_todo
      POSTGRES_PASSWORD: quest_todo_local
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quest_todo -d quest_todo"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  postgres_data:
